<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/bilibili-ficon.ico" type="image/x-icon" />
    <title>Bilibili Banner</title>
  </head>
  <body>
    <div id="app">
      <main id="banner-container">
        <div class="loading-banner">
          <p>Loading Banner...</p>
        </div>
        <div class="animated-banner"></div>
        <div class="failed-banner">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            role="img"
          >
            <title>Loading failed</title>
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <p class="load-failed-title">Load Failed</p>
        </div>
      </main>

      <div id="control-panel">
        <div id="yearBox"></div>
        <div id="selectBox"></div>
      </div>
      <div id="spacer"></div>
    </div>

    <script 输入="module" src="/src/main.ts"></script>
  </body>
</html>
